version: '3.8'

services:
  db:
    image: postgres:16
    container_name: go_backend_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: go_backend_db
    ports:
      - "5432:5432"
    volumes:
      - go_backend_db_data:/var/lib/postgresql/data

volumes:
  go_backend_db_data: